name: DoubleSlitLab
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_MODULES: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_VERSION: ""
targets:
  DoubleSlitLab:
    type: application
    platform: macOS
    sources:
      - path: DoubleSlitLab
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DoubleSlitLab
        PRODUCT_NAME: DoubleSlitLab
        INFOPLIST_FILE: DoubleSlitLab/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - sdk: SceneKit.framework
      - sdk: QuartzCore.framework
      - sdk: UniformTypeIdentifiers.framework
  DoubleSlitLabTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DoubleSlitLabTests
    dependencies:
      - target: DoubleSlitLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DoubleSlitLabTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DoubleSlitLab.app/Contents/MacOS/DoubleSlitLab"
        BUNDLE_LOADER: "$(TEST_HOST)"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/DoubleSlitLab/Model"
        # The XCTest framework shipped with the current toolchain has a macOS 14
        # minimum, even though the app itself still deploys back to macOS 13.
        MACOSX_DEPLOYMENT_TARGET: "14.0"
schemes:
  DoubleSlitLab:
    build:
      targets:
        DoubleSlitLab: all
        DoubleSlitLabTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DoubleSlitLabTests
